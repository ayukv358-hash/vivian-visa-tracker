name: Spain Visa Appointment Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check CitaConsular
        env:
          CITA_URL: ${{ secrets.CITA_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_visa.py

      - name: Test Bookitit widget loader
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -L --max-time 30 -A "Mozilla/5.0" "https://app.bookitit.com/js/widgets/loader.js" -o /tmp/loader.js -w "\nHTTP_STATUS:%{http_code}\n"
          echo "LOADER_BYTES:"
          wc -c /tmp/loader.js
          echo "LOADER_HEAD:"
          head -c 3000 /tmp/loader.js
      - name: Inspect Bookitit loader
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "BOOKITIT ENDPOINT REFERENCES:"
          grep -oiE '.{0,100}(onlinebookings|getwidget|getservices|getagendas|datetime).{0,150}' /tmp/loader.js | head -50
      - name: Save checker state
        run: |
          git config user.name "visa-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update appointment checker state"
          git push
